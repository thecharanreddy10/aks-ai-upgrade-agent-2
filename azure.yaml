# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-with-foundry-toolbox-responses
services:
    agent-framework-agent-with-foundry-toolbox-responses:
        project: ./src/agent-framework-agent-with-foundry-toolbox-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            TOOLBOX_ENDPOINT: https://cog-vtjc46vefyyj6.services.ai.azure.com/api/projects/agent-framework-agent-with-found/toolboxes/aks-agent-tools-v2/versions/1/mcp?api-version=v1
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: agent-framework-agent-with-foundry-toolbox-responses
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        endpoint: https://cog-vtjc46vefyyj6.services.ai.azure.com/api/projects/agent-framework-agent-with-found
infra:
    provider: microsoft.foundry
